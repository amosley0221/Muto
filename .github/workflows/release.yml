name: Release

# Publishes a signed APK to the releases page.
#
# To cut a release: bump the VERSION file and push. The workflow creates the tag itself.
#
# There is deliberately no tag trigger. Under `push`, listing `tags` excludes branch pushes, and
# a `paths` filter then has to hold for the tag push as well - which it never does, since a tag
# push changes no files. One trigger that works beats two that interfere.
#
# Signing secrets are what make an installed copy upgradeable in place; see docs/RELEASING.md.
on:
  push:
    branches: ["**"]
    paths: ["VERSION"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to (re)build and publish, e.g. v0.2.0. Defaults to the VERSION file."
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Release notes are built by diffing against the previous tag, which needs history.
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(grep -vE '^[[:space:]]*(#|$)' VERSION | head -1 | tr -d ' \t\n\r')"
          fi
          VERSION="${TAG#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH. The version code is derived from those"
            echo "::error::three numbers, and Android rejects an update whose code did not rise."
            exit 1
          fi
          MAJOR="${VERSION%%.*}"; REST="${VERSION#*.}"
          MINOR="${REST%%.*}"; PATCH="${REST#*.}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version code $(( MAJOR * 10000 + MINOR * 100 + PATCH )))"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the SDK packages the build needs
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "$SDK_ROOT" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found; relying on the Android plugin to fetch what it needs."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MUTO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::MUTO_KEYSTORE_BASE64 is not set, so the APK would be unsigned - and an"
            echo "::error::unsigned APK cannot be installed on a device at all."
            echo "::error::Set the four signing secrets first; see docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/muto-release.jks"
          echo "path=$RUNNER_TEMP/muto-release.jks" >> "$GITHUB_OUTPUT"

      - name: Test the filtering engine
        run: ./gradlew :core:test

      - name: Build the signed release APK
        env:
          MUTO_VERSION_NAME: ${{ steps.version.outputs.version }}
          MUTO_VERSION_CODE: ${{ steps.version.outputs.code }}
          MUTO_KEYSTORE_FILE: ${{ steps.signing.outputs.path }}
          MUTO_KEYSTORE_PASSWORD: ${{ secrets.MUTO_KEYSTORE_PASSWORD }}
          MUTO_KEY_ALIAS: ${{ secrets.MUTO_KEY_ALIAS }}
          MUTO_KEY_PASSWORD: ${{ secrets.MUTO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Name the APK after its version
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DEST="muto-${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Confirm the APK is signed with the expected key
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          # An unsigned APK installs on nothing, and a wrongly signed one cannot update an
          # existing copy. Both are worth catching before publishing, not after.
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}"
          echo "The certificate digest above must be identical on every release."

      - name: Write the release notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          NOTES=release-notes.md

          # A hand-written CHANGELOG section wins, because it can say what changed for someone
          # using the app. Commit subjects are the fallback, not the first choice.
          if [ -f CHANGELOG.md ] && awk -v v="## $VERSION" '$0 ~ "^"v { found=1 } END { exit !found }' CHANGELOG.md; then
            awk -v v="## $VERSION" '
              $0 ~ "^"v { printing=1; next }
              printing && /^## / { exit }
              printing { print }
            ' CHANGELOG.md > "$NOTES"
          else
            PREVIOUS=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)
            {
              echo "### Changes"
              echo
              if [ -n "$PREVIOUS" ]; then
                git log --no-merges --pretty="- %s" "$PREVIOUS..HEAD"
              else
                git log --no-merges --pretty="- %s" -20
              fi
            } > "$NOTES"
          fi

          cat >> "$NOTES" <<'FOOTER'

          ---

          ### Installing

          Download `muto-<version>.apk` below on the phone and open it. Android will ask you to
          allow installing from this source the first time.

          **Updating:** install the new APK straight over the old one. Your rules, lists and
          settings are kept, and there is no need to uninstall first — every release is signed
          with the same key, which is what allows the upgrade.

          If Android says *"App not installed"*, the copy on your device was signed with a
          different key. That happens if you previously installed a debug build from the Build
          workflow, which is deliberately a separate app. Uninstall that copy once, install this
          one, and future updates will apply in place.
          FOOTER
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running a release should replace its asset rather than fail.
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
            gh release edit "$TAG" --notes-file "${{ steps.notes.outputs.path }}"
          else
            # --target creates the tag too, so a release can be cut from a VERSION bump alone.
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --target "$GITHUB_SHA" \
              --title "Muto ${{ steps.version.outputs.version }}" \
              --notes-file "${{ steps.notes.outputs.path }}"
          fi
          echo "Published: $(gh release view "$TAG" --json url --jq .url)"
