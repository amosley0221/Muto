name: Build

# Runs on every push and pull request. This is the job that actually compiles the Android module,
# so it is the first thing to look at when something is wrong.
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the SDK packages the build needs
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "SDK root: ${SDK_ROOT:-<unset>}"

          # sdkmanager is not on PATH on the hosted runners; it lives under cmdline-tools, and
          # the directory under it is versioned, so it has to be looked up rather than assumed.
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "$SDK_ROOT" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found; relying on the Android plugin to fetch what it needs."
            exit 0
          fi

          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Test the filtering engine
        run: ./gradlew :core:test

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: muto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/tests/**
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
