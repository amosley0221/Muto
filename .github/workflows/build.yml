name: Build

# Runs on every push and pull request. This is the job that actually compiles the Android module,
# so it is the first thing to look at when something is wrong.
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Needed to keep the rolling debug prerelease up to date.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the SDK packages the build needs
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "SDK root: ${SDK_ROOT:-<unset>}"

          # sdkmanager is not on PATH on the hosted runners; it lives under cmdline-tools, and
          # the directory under it is versioned, so it has to be looked up rather than assumed.
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "$SDK_ROOT" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found; relying on the Android plugin to fetch what it needs."
            exit 0
          fi

          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Test the filtering engine
        run: ./gradlew :core:test

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      # The release variant is the one that ships, and it is the only one that runs R8. Build it
      # unsigned on every push so a minification problem surfaces here rather than at the moment
      # someone is trying to cut a release. Unsigned is fine: this APK is never published, it
      # exists to prove the release path compiles, shrinks and packages.
      - name: Build the release APK unsigned
        run: ./gradlew :app:assembleRelease

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: muto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # An Actions artifact is a zip behind a login, which is a poor way to hand someone an APK
      # to install on a phone. The same file as a prerelease asset is a direct, tappable link.
      # This is the debug build, not a release: see the notes it publishes.
      - name: Publish the debug APK as a rolling prerelease
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$SRC" muto-debug-latest.apk

          cat > prerelease-notes.md <<'NOTES'
          Automatic build of the latest commit on the default branch. **This is a debug build**,
          published here because an Actions artifact is a zip behind a login and this is a link
          you can tap on a phone.

          Download `muto-debug-latest.apk` below and open it on the device.

          ### What to know before installing

          - It installs as a **separate app** from a proper release: the application id is
            `dev.muto.app.debug`. A real release will not update it, and it will not update a
            release. You can have both installed at once.
          - It is **not minified**, so it is larger and slower than a release build, and it does
            not exercise the release code path.
          - Each new push replaces this file. One debug build does update another, because they
            are all signed with the same committed debug key.

          When the signing secrets are configured, proper versioned releases appear on this page
          alongside this one — install one of those instead and uninstall this.
          NOTES

          if gh release view ci-debug >/dev/null 2>&1; then
            gh release upload ci-debug muto-debug-latest.apk --clobber
            gh release edit ci-debug --notes-file prerelease-notes.md
          else
            gh release create ci-debug muto-debug-latest.apk \
              --prerelease \
              --title "Latest debug build" \
              --notes-file prerelease-notes.md
          fi
          echo "Debug APK published: $(gh release view ci-debug --json url --jq .url)"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/tests/**
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
